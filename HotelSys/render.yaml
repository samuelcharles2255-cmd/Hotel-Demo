services:
  - type: web
    name: hotelsys-api
    runtime: python
    rootDir: HotelSys
    buildCommand: pip install -r requirements.txt && python manage.py migrate
    startCommand: gunicorn config.wsgi:application
    envVars:
      - key: DEBUG
        value: "False"
      - key: USE_LOCAL_DB
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1,hoteldemoweb.vercel.app"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://hoteldemoweb.vercel.app,http://localhost:3010"
      - key: DATABASE_URL
        sync: false
